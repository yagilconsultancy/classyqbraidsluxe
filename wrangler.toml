name = "classyqbraidsluxe"
compatibility_date = "2025-01-01"
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "classyqbraidsluxe"
database_id = "8b654e86-c92d-4b48-b6f5-3193161fef4c"

# Stores customer uploads: booking payment-proof screenshots and
# booking inspiration photos/videos. Replaces base44.integrations.Core.UploadFile.
